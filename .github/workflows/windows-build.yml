name: Windows x64 build and package

on:
  # Build only when explicitly requested from Actions > Run workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Qt 6.8.3 MSVC x64
        id: qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Validate PowerShell scripts and packaging guardrails
        run: ./tests/windows-scripts.Tests.ps1

      - name: Install NASM for optimized AV1 inspection
        run: |
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed.' }
          'C:\Program Files\NASM' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install toolchain for patched motion helper
        id: msys2
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          install: >-
            make patch tar curl nasm
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build dependencies, package and smoke test
        id: package
        env:
          BITSCOPE_QT_PREFIX: ${{ steps.qt.outputs.qt-root-dir }}
          BITSCOPE_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./package-windows.ps1 -QtPrefix $env:BITSCOPE_QT_PREFIX -Jobs 4

      - name: Upload tested Windows package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: BitScope-windows-x64-${{ github.run_number }}
          path: |
            ${{ steps.package.outputs.zip-path }}
            ${{ steps.package.outputs.manifest-path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-build-diagnostics-${{ github.run_number }}
          path: |
            build-windows*/**/CMakeConfigureLog.yaml
            build-windows*/**/CMakeCache.txt
            build-windows*/**/smoke-preview.png
            dist/**/INCOMPLETE.txt
          if-no-files-found: ignore
          retention-days: 7
